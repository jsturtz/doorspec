[project]
name = "catalog-service"
version = "0.3.0"
description = "DoorSpec catalog of door hardware products and their attributes."
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-check>=2.9.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
