# Local dev infrastructure. Services get added here phase by phase.
# Credentials are dev-only defaults; override them in a root .env if needed.
services:
  catalog-db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${CATALOG_DB_USER:-catalog}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog}
      POSTGRES_DB: ${CATALOG_DB_NAME:-catalog}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - catalog_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  catalog_pgdata:
